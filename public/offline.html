<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoinWise — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #080C14;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', 'Segoe UI', sans-serif;
      color: #E8EDF5;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 380px;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1E6FD9, #0D4FA8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(30,111,217,0.3);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #F0F4FF;
      margin-bottom: 10px;
      letter-spacing: -0.4px;
    }
    p {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 20px;
      color: #F59E0B;
      font-size: 13px;
      margin-bottom: 28px;
    }
    button {
      padding: 12px 28px;
      background: linear-gradient(135deg, #1E6FD9, #0D4FA8);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(30,111,217,0.3);
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">💰</div>
    <h1>You're offline</h1>
    <p>CoinWise needs an internet connection to sync your transactions and account data.</p>
    <div class="badge">
      <span>📡</span>
      <span>No internet connection</span>
    </div>
    <br/>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
